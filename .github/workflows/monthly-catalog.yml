name: Monthly catalogue validation and manifest

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-catalog
  cancel-in-progress: false

jobs:
  validate-and-publish-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalogue and generate manifest
        run: python scripts/validate_catalog.py
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(catalog): refresh monthly manifest"
          git push
